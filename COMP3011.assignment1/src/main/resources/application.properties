
spring.application.name=Assignment1

# Server concurrency
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=20
server.tomcat.threads.max-queue-capacity=0

# Maximum size of one uploaded file
spring.servlet.multipart.max-file-size=25MB

# Maximum total multipart request size
spring.servlet.multipart.max-request-size=25MB

# Transcription service (local Whisper-compatible server)
transcription.url=http://127.0.0.1:8000/v1/audio/transcriptions
transcription.api-key=${OPENAI_API_KEY:}

# Subtitle service (Groq Whisper API)
subtitle.api.url=https://api.groq.com/openai/v1/audio/transcriptions
subtitle.api.key=${GROQ_API_KEY:}
